# Sitio estático PXNDEV — NO proxy a Gunicorn.
# Instalar: /etc/nginx/sites-available/pxndev.roda.st
# Activar: ln -s ... sites-enabled/ && nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pxndev.roda.st;

    root /var/www/pxndev;
    index index.html;

    # SPA: rutas internas (#servicios) no usan history API; try_files por si agregás rutas después
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/pxndev.roda.st.access.log;
    error_log  /var/log/nginx/pxndev.roda.st.error.log;
}

